# Ferremax — stack local end-to-end: PostgreSQL + API.
# Levantar todo:  docker compose up --build
# La API queda en http://localhost:4000 con el tenant demo "el-tornillo" seedeado.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ferremax
      POSTGRES_PASSWORD: ferremax
      POSTGRES_DB: ferremax
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ferremax']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://ferremax:ferremax@db:5432/ferremax
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      ROOT_DOMAIN: ferremax.app
      PORT: '4000'
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
