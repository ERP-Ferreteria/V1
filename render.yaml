# Blueprint de Render — backend Ferremax (Postgres gestionado + API en Docker).
# Deploy: render.com → New → Blueprint → conectar el repo → aplica este archivo.
databases:
  - name: ferremax-db
    plan: free
    postgresMajorVersion: '16'

services:
  - type: web
    name: ferremax-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ferremax-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ROOT_DOMAIN
        value: ferremax.app
      - key: PORT
        value: '4000'
